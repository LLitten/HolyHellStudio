name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Run by the review tracker after it changes files.
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: withastro/action@v6

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
